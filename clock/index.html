<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
    <audio id="tickSound" src="sounds/751088__smallconfusion__mechanical-plastic-click-10.wav"></audio>
    <audio id="trainSound" src="sounds/train-running-sound-384968.mp3"></audio>
    <div class="clock">
        <div class="reel">
            <div class="strip" id="h1"></div>
        </div>
        <div class="reel">
            <div class="strip" id="h2"></div>
        </div>
        <div class="colon">:</div>
        <div class="reel">
            <div class="strip" id="m1"></div>
        </div>
        <div class="reel">
            <div class="strip" id="m2"></div>
        </div>
        <div class="colon">:</div>
        <div class="reel">
            <div class="strip" id="s1"></div>
        </div>
        <div class="reel">
            <div class="strip" id="s2"></div>
        </div>
    </div>
</body>
</html>
