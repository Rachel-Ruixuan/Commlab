<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script_language.js" defer></script>
</head>

<div class="scroll_space"></div>
<body>
    <!-- scroll down -> move to right -->
    <!-- move to the rightest -> show the picture for this chapter -->
    <!-- chapters: Birth, Human life, Rejection, Revenge -->

    <div class="peek_container">
        <img src="images/The_delacey_family.webp" class="delacy">
        <div class="thought_stream" id="thought_stream">
            <div class="thought_scroll" id="thought_scroll"></div>
        </div>
        <p class="peek_hint">scroll inside to continue...</p>

    </div>
    <div class="book_container">
        <div class="book">
            <div class="single_page" id="page">
                <h2 id="stage_title">BOOK 1</h2>
                <div class="para">
                    <p id="para_p"></p>
                </div>
            </div>
        </div>
        <p class="instruction">click right to continue, click left to go back</p>
    </div>


    <div class="split_intro_overlay" id="split_intro_overlay">
        <div class="split_intro_panel intro_left_panel" id="intro_left_panel">
            <p class="intro_main">I want to observe human life.</p>
            <p class="intro_hint">click to peek into the family</p>
        </div>
        <div class="split_intro_panel intro_right_panel" id="intro_right_panel">
            <p class="intro_main">I found a book.</p>
            <p class="intro_hint">click to begin learning their language</p>
        </div>
    </div>
</body>

</html>
